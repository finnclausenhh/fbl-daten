name: Ausfall-Wächter

# Prüft alle 4 Stunden, ob Ticker, Spielplan und Inside frisch sind.
# Schlägt der Check fehl, schickt GitHub eine Mail an den Repo-Inhaber (Einstellung: Notifications > Actions).
on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Daten prüfen
        run: python3 tools/frische_check.py --repo .
