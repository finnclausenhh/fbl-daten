name: Supabase wach halten
# Gratis-Projekte pausieren nach rund 7 Tagen ohne Aktivität. Eine Abfrage pro Tag verhindert das.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Datenbank abfragen
        run: |
          code=$(curl -s -o antwort.json -w '%{http_code}' \
            -X POST "https://tyhlxkgyfykxjwnqgnoj.supabase.co/rest/v1/rpc/tipp_stand" \
            -H "apikey: sb_publishable_8OOLyVhf2kPU7h_NfKAypg_FAC8P7h3" \
            -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"; head -c 300 antwort.json; echo
          test "$code" = "200"
