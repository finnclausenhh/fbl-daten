name: Aufstellungen live

# Holt offizielle Aufstellungen (Liga, DFB-Pokal, Champions League) von der Sportschau, sobald sie da sind,
# und schreibt sie sofort in news.json. Ohne Claude.
# Start: stündlich per Zeitplan (GitHub startet geplante Läufe oft verspätet) und von Hand.
# Kette: Steht heute noch ein Spiel mit Bundesliga-Verein an, startet sich die Action am Ende selbst neu
# (workflow_dispatch mit GITHUB_TOKEN ist erlaubt). So läuft sie an Spieltagen lückenlos bis zum letzten Anpfiff.
on:
  schedule:
    - cron: "3 6-21 * * *"
    - cron: "33 6-21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: aufstellungen-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aufstellungen holen
        id: auf
        run: python3 tools/aufstellungen_live.py --repo . --push --laufzeit 28
      - name: Kette fortsetzen
        if: always() && steps.auf.outputs.weiter == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run aufstellungen.yml --ref main -R ${{ github.repository }}
