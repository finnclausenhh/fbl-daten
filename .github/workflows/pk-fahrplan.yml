name: PK-Fahrplan

# Freitags vor dem Spieltag (Finn 13.11.2026): News "Vor dem x. Spieltag: Pressekonferenzen und späte Updates" (tools/pk_fahrplan.py).
# Bestätigte Termine stehen in tools/pk_termine.json, sonst nur die Gewohnheit der Vereine. Kein Claude-Lauf, keine Kosten.
# Seit 13.11.2026 auch die Vorberichte: tools/vorberichte.py sucht sie auf den Vereinsseiten, die News wird Freitag bis
# Montag alle 3 Stunden aufgefrischt (Zeit bleibt, nicht angeheftet), der Verlauf in tools/vorberichte.json lernt die Gewohnheit.
on:
  schedule:
    - cron: "5 7 * * 5"          # Freitag 08:05 (MEZ): News anlegen
    - cron: "35 5-20/3 * * 5,6,0,1"  # Fr bis Mo alle 3 Stunden: neue Vorberichte nachtragen
  # Seit 21.11.2026: nach jedem fremden Push auf news.json (z. B. Spiegel aus dem Artifact) die News sofort wieder einbauen,
  # sonst fehlt sie bis zum nächsten Lauf. Pushes dieser Action lösen sie nicht erneut aus.
  push:
    branches: [main]
    paths: [news.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten-schreiben
  cancel-in-progress: false

jobs:
  fahrplan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vorberichte suchen
        if: github.event_name != 'push'
        continue-on-error: true
        run: python3 tools/vorberichte.py --repo .
      - name: News bauen oder auffrischen
        run: python3 tools/pk_fahrplan.py --repo . --auffrischen
      - name: Speichern
        # Seit 22.11.2026 ohne Rebase: "Aufstellungen schützen" läuft nach demselben Push und schreibt ebenfalls news.json,
        # der Rebase endete dann im Konflikt. Ist main weiter, wird auf den neuen Stand gesetzt und die News dort neu eingebaut.
        run: |
          git config user.name "WOSOINSIDER"; git config user.email "finnclausenhh@users.noreply.github.com"
          cp tools/vorberichte.json "$RUNNER_TEMP/vorberichte.json"
          for i in 1 2 3 4 5 6; do
            git add news.json tools/vorberichte.json
            if git diff --cached --quiet; then echo "keine Änderung"; exit 0; fi
            git commit -qm "PK-Fahrplan vor dem Spieltag"
            if git push -q origin HEAD:main; then exit 0; fi
            echo "main ist weiter, Versuch $i: neu aufsetzen"
            sleep $((i * 5))
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            cp "$RUNNER_TEMP/vorberichte.json" tools/vorberichte.json
            python3 tools/pk_fahrplan.py --repo . --auffrischen
          done
          exit 1
