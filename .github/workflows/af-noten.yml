name: Noten-Wächter

# Prüft nach jedem Abpfiff alle 3 Minuten, ob API-Football die Noten hat, und startet dann sofort den Bau von
# apifootball.json (tools/af_noten.py). Ohne offenes Spiel endet der Lauf nach wenigen Sekunden.
# Start auch direkt aus Live-Ergebnis beim Abpfiff (laufzeit 75, 07.11.2026), weil geplante Läufe ausblieben.
# Messwerte (wann waren die Noten da, wie lange nach Abpfiff): tracking/noten_zeit.json
on:
  schedule:
    - cron: "7,22,37,52 10-22 * * *"
  workflow_dispatch:
    inputs:
      laufzeit:
        description: "Minuten (bei Start aus dem Abpfiff 75)"
        default: "14"

permissions:
  contents: write
  actions: write

concurrency:
  group: af-noten
  cancel-in-progress: false

jobs:
  noten:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Noten prüfen
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -u tools/af_noten.py --repo . --laufzeit ${{ inputs.laufzeit || '14' }} --start
      - name: Messung sichern
        run: |
          [ -f tracking/noten_zeit.json ] || exit 0
          git add tracking/noten_zeit.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=WOSOINSIDER -c user.email=finnclausenhh@users.noreply.github.com commit -qm "Noten-Wächter: Messung"
          for i in 1 2 3 4; do git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && break; sleep 5; done
