<style>
/* Design wie die iOS-App (ab Version 0.7): dunkles Schema, Karten ohne Rahmen, Farben aus Theme.swift */
:root{
  color-scheme:dark;
  --bg:#0E1726; --card:#16223A; --soft:#1D2B47; --line:#2A3954; --ink:#F4F5F7; --muted:#A9B4C6; --accent:#2F5BFF;
  --inj:#E24A4A; --ban:#9B6BE8; --back:#2EB872; --frag:#E0962B; --pokal:#E0962B; --euro:#9B6BE8; --opin:#14B8A6;
  --s-sicher:#6E9BFF; --s-erwartet:#22C55E; --s-unsicher:#F59E0B; --s-unwahr:#F87171; --s-aus:#8A95A8;
  --rasen:#17313D; --hell:#8FB0FF; --gruen:#4ADE80; --rot:#FF8A8A; --gelb:#F5B041;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--s-sicher);outline-offset:2px}
a{color:var(--accent)}
.mu{color:var(--muted)}

/* Kopf: gestapeltes Logo, darunter Segmente */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.bar-in{max-width:720px;margin:0 auto;padding:8px max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));display:grid;gap:8px}
.logo{justify-self:center;display:grid;font-family:var(--f-display);font-weight:800;font-size:17px;line-height:.8;letter-spacing:.3px}
.logo b{color:var(--ink);font-weight:800}.logo i{font-style:normal;color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:rgba(118,118,128,.24);border-radius:9px;padding:2px}
.seg button{border-radius:7px;padding:6px 4px;font-size:13px;font-weight:500;text-align:center;color:var(--ink)}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:#636366;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.25)}

main{max-width:720px;margin:0 auto;padding:4px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.liste{display:grid;gap:10px}
.leer{color:var(--muted);padding:40px 4px;text-align:center}

/* Bausteine */
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center;min-width:0}
.tag{font-size:11px;font-weight:800;line-height:1;padding:4px 6px 3px;border-radius:3px;white-space:nowrap;text-transform:uppercase}
.kap{font:600 10.5px var(--f-mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.disp{font-family:var(--f-display);font-weight:800;line-height:1.02;margin:0;text-wrap:balance}
.kb{background:rgba(47,91,255,.12);border-radius:8px;padding:10px;display:grid;gap:4px}
.kb b{font-size:11px;font-weight:800;letter-spacing:.3px;color:var(--accent);text-transform:uppercase}
.kb span{font-size:14px}
.ki{font-size:12px;color:var(--muted);margin:0}
.ki button,.lk{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.lg{display:block;object-fit:contain;flex:none}
.plak{flex:none;border-radius:50%;display:grid;place-items:center}
.plak svg{width:55%;height:55%;stroke:#fff;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.sym{flex:none;border-radius:50%;display:inline-grid;place-items:center;vertical-align:middle}
.sym svg{width:62%;height:62%;stroke:#fff;fill:none;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.sym.sicher svg{fill:#fff;stroke-width:1.2}
.ball{width:11px;height:11px;flex:none;color:var(--ink)}
.krt{display:inline-block;width:8px;height:11px;border-radius:1.5px;flex:none}
.back{color:var(--accent);font-weight:600;padding:10px 0 6px;display:inline-block}
.det{display:grid;gap:14px;padding-bottom:8px}
.det p{margin:0}
.body{display:grid;gap:14px}
.body p{font-size:16.5px;line-height:1.55}

/* Bild der Spielerin: Foto, Silhouette in Vereinsfarbe oder Wappen */
.bild{position:relative;flex:none;overflow:hidden;background:var(--soft);display:grid;place-items:center}
.bild > img.f{width:100%;height:100%;object-fit:cover;object-position:50% 0}
.bild .sil{position:absolute;left:14%;right:14%;bottom:0;height:80%;fill:rgba(255,255,255,.42)}
.bild .nr{position:absolute;left:8%;top:4%;font-family:var(--f-display);font-weight:800;color:rgba(255,255,255,.9);line-height:1}
.bild .wap{position:absolute;right:5%;bottom:5%;background:#fff;border-radius:50%;display:grid;place-items:center}

/* News-Karte */
.nk{display:flex;gap:12px;align-items:flex-start;width:100%;background:var(--card);border-radius:14px;padding:12px}
.nk-b{flex:1;min-width:0;display:grid;gap:5px}
.nk-top{display:flex;gap:5px;align-items:center;min-height:22px}
.nk-top .tags{flex:1}
.nk-r{display:flex;gap:2px;flex:none;align-self:flex-start}
.nk h2{margin:0;font-size:16px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nk .elf{margin:0;font-size:14.5px;font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.nk .meta{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neu{font-size:9px;font-weight:800;color:var(--s-sicher);border:1px solid var(--s-sicher);border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.elf .neu{border:0;padding:0;margin-left:3px}
.raus{font-size:9px;font-weight:800;color:var(--inj);border:1px solid var(--inj);border-radius:3px;padding:0 3px;white-space:nowrap}

/* Auf den Punkt */
.pk{display:flex;gap:12px;width:100%;background:var(--card);border-radius:14px;padding:12px;border:1px solid transparent}
.pk.fest{background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:var(--accent)}
.pk-t{width:84px;height:84px;flex:none;border-radius:10px;background:var(--soft);color:#fff;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-weight:800;line-height:.9}
.pk.fest .pk-t{background:var(--accent)}
.pk-t b{font-size:36px}.pk-t span{font-size:14px}
.pk-b{flex:1;display:flex;flex-direction:column;gap:6px;min-height:84px}
.pk-b h2{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.pk-b .z{margin-top:auto;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:var(--muted)}
.pk.fest .pk-b .z{font-weight:700;color:var(--accent)}

/* Top-Analyse im Ticker */
.ana{width:100%;background:var(--card);border-radius:14px;overflow:hidden;display:block}
.ana-k{padding:12px 14px;display:grid;gap:8px;color:#fff}
.ana-k .z1{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:rgba(255,255,255,.85)}
.ana-k .tg{background:#fff;border-radius:3px;padding:3px 6px 2px;font-size:10.5px;font-weight:800}
.ana-k .z2{display:flex;gap:10px;align-items:center}
.ana-k h3{flex:1;margin:0;font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.02;color:#fff}
.ana-b{padding:12px 14px 14px;display:grid;gap:12px}
.kz{display:flex;gap:10px;align-items:baseline}
.kz b{font-family:var(--f-display);font-weight:800;color:var(--hell);white-space:nowrap;line-height:1}
.kz span{font-size:13px;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--rot)}
.dots i.t{background:var(--s-sicher)}
.go{font-size:12px;font-weight:700;color:var(--s-sicher)}

/* Artikel */
.mk{display:flex;gap:12px;align-items:flex-start}
.mk-m{flex:1;min-width:0;display:grid;gap:6px}
.mk-m .wer{font-weight:600;font-size:17px}
.mk-st{display:grid;justify-items:center;gap:3px;font-size:11px;color:var(--muted)}
.dat{font-size:12px;color:var(--muted)}
.src{display:grid;gap:6px;font-size:14px}
.credit{font-size:11px;color:var(--muted)}

.kartebox{background:var(--card);border-radius:14px;padding:12px;display:grid;gap:10px}
.rasen{background:var(--rasen);border-radius:9px;padding:8px;display:grid;gap:7px}
.pz{display:grid;grid-template-columns:30px minmax(0,1fr);gap:6px;align-items:start}

.chip .tz{font-size:10.5px;font-weight:700}
.chip .aus{font-size:10.5px;font-weight:600;color:#FF9A9A;white-space:nowrap}
.chip .ein{font-size:11px;font-weight:700;color:var(--gruen)}
.chip .neu{margin-left:0}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);align-items:center}
.leg > span{display:inline-flex;align-items:center;gap:5px}

  const KURZ = {"FC Bayern":"FCB","VfL Wolfsburg":"WOB","Eintracht Frankfurt":"SGE","Bayer Leverkusen":"B04","1. FC Köln":"KOE","RB Leipzig":"RBL",
    "Werder Bremen":"SVW","SC Freiburg":"SCF","Union Berlin":"FCU","VfB Stuttgart":"VFB","TSG Hoffenheim":"TSG","Hamburger SV":"HSV","1. FC Nürnberg":"FCN","Mainz 05":"M05"};
  const KNAME = {FCB:"FC Bayern",WOB:"Wolfsburg",SGE:"Frankfurt",B04:"Leverkusen",KOE:"Köln",RBL:"Leipzig",SVW:"Werder",SCF:"Freiburg",FCU:"Union",VFB:"Stuttgart",TSG:"Hoffenheim",HSV:"HSV",FCN:"Nürnberg",M05:"Mainz"};
  const KFARBE = {FCB:"#DC052D",WOB:"#65B32E",SGE:"#1A1A1A",B04:"#E32221",KOE:"#ED1C24",RBL:"#DD0741",SVW:"#1D9053",SCF:"#111111",FCU:"#D4011D",VFB:"#E32219",TSG:"#1961B5",HSV:"#0A3F86",FCN:"#AD1732",M05:"#C3141E"};
  const ALLE = ["FCB","WOB","SGE","B04","KOE","RBL","SVW","SCF","FCU","VFB","TSG","HSV","FCN","M05"];
  const POS = ["TW","ABW","DM","MF","OM","ST"];
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fett = s => esc(s).replace(/&lt;b&gt;/g, "<b>").replace(/&lt;\/b&gt;/g, "</b>");
  const svg = (d, cls) => `<svg viewBox="0 0 24 24" aria-hidden="true"${cls ? ` class="${cls}"` : ""}>${d}</svg>`;
  const P = {
    stern:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>', haken:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    frage:'<path d="M9 9a3 3 0 115.6 1.3c-.8 1.3-2.6 1.8-2.6 3.7M12 18.5v.1"/>', ausruf:'<path d="M12 5v9M12 18.5v.1"/>', x:'<path d="M7 7l10 10M17 7L7 17"/>',
    plus:'<path d="M12 5v14M5 12h14"/>', verbot:'<circle cx="12" cy="12" r="8"/><path d="M6.5 17.5l11-11"/>', zurueck:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
    links:'<path d="M15 5l-7 7 7 7"/>', rechts:'<path d="M9 5l7 7-7 7"/>', pfeil:'<path d="M4 12h15M13 6l6 6-6 6"/>', uhr:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    warn:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.1"/>'
  };
  const BALL = '<svg class="ball" viewBox="0 0 24 24" aria-label="Tor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.6l3.6 2.6-1.4 4.2H9.8L8.4 10.2z" fill="currentColor"/></svg>';
  const SIL = '<svg class="sil" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="30" r="22"/><path d="M4 100c0-26 20-44 46-44s46 18 46 44z"/></svg>';
  const logo = (k, g) => k ? `<img class="lg" src="logos/${esc(k)}.png" alt="" style="width:${g}px;height:${g}px" onerror="this.style.visibility='hidden'">` : `<span style="width:${g}px;height:${g}px;display:inline-block"></span>`;
  const kname = k => KNAME[k] || k || "";
  // Ringfarbe: Vereinsfarbe, bei sehr dunklen Farben (Frankfurt, Freiburg) hell, damit sie auf dem dunklen Grund sichtbar bleibt
  const ring = k => { const c = KFARBE[k] || "#2F5BFF", n = parseInt(c.slice(1), 16), l = (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255));
    return l < 60 ? "#F4F5F7" : c; };

  const TAGF = {TOP:["#2F5BFF","#fff"], VERLETZUNG:["#E24A4A","#fff"], SPERRE:["#9B6BE8","#fff"], "RÜCKKEHR":["#2EB872","#fff"],
    INSIDER:["#F4F5F7","#0E1726"], ANALYSE:["#F4F5F7","#0E1726"], UPDATE:["#F4F5F7","#0E1726"], PUNKT:["#2F5BFF","#fff"], "AUF DEN PUNKT":["#2F5BFF","#fff"],
    STANDARD:["rgba(224,150,43,.2)","#E0962B"], ROTATION:["rgba(155,107,232,.2)","#9B6BE8"], TRANSFER:["rgba(155,107,232,.2)","#9B6BE8"],
    SPIELBERICHT:["#1D2B47","#F4F5F7"], AUFSTELLUNG:["rgba(47,91,255,.18)","#6E9BFF"]};
  const tag = t => { const f = TAGF[String(t).toUpperCase()] || ["#1D2B47","#F4F5F7"]; return `<span class="tag" style="background:${f[0]};color:${f[1]}">${esc(t)}</span>`; };
  const kap = (t, farbe) => `<div class="kap"${farbe ? ` style="color:${farbe}"` : ""}>${esc(t)}</div>`;
  const kbBox = t => t ? `<div class="kb"><b>Für Kickbase</b><span>${esc(t)}</span></div>` : "";
  const kiHinweis = (t = "Automatisiert mit KI aus den genannten Quellen erstellt.") => `<p class="ki">${esc(t)} <button data-legal="so-entsteht">So entsteht WOSOINSIDER</button></p>`;

  const STUFE = {sicher:["stern","#6E9BFF","Sicher"], erwartet:["haken","#22C55E","Erwartet"], unsicher:["frage","#F59E0B","Unsicher"],
    unwahrscheinlich:["ausruf","#F87171","Unwahrscheinlich"], ausgeschlossen:["x","#8A95A8","Ausgeschlossen"]};
  const stufeSym = (st, g = 16) => STUFE[st] ? `<span class="sym ${st}" style="width:${g}px;height:${g}px;background:${STUFE[st][1]}" title="${STUFE[st][2]}" role="img" aria-label="${STUFE[st][2]}">${svg(P[STUFE[st][0]])}</span>` : "";
  const karte = rot => `<span class="krt" style="background:${rot ? "#E24A4A" : "#F5C518"}" role="img" aria-label="${rot ? "Rote Karte" : "Gelbe Karte"}"></span>`;

  // Status: nur was sich geändert hat (kein Symbol für fit)
  const STATUS = {rueckkehr:["zurueck","#22A35A","zurück"], fraglich:["frage","#E0962B","fraglich"], verletzt:["plus","#E24A4A","verletzt"], gesperrt:["verbot","#9B6BE8","gesperrt"]};
  function meldungsStatus(m){
    if (m.status) return m.status;
    const t = m.tags || [];
    return t.includes("SPERRE") ? "gesperrt" : t.includes("VERLETZUNG") ? "verletzt" : t.includes("RÜCKKEHR") ? "rueckkehr" : null;
  }
  const plakette = (s, g = 22) => { const x = STATUS[String(s || "").toLowerCase()]; return x ? `<span class="plak" style="width:${g}px;height:${g}px;background:${x[1]}" role="img" aria-label="${x[2]}">${svg(P[x[0]])}</span>` : ""; };

  // ---------------- Datum (Europe/Berlin wie in den Daten)
  const WT = ["So","Mo","Di","Mi","Do","Fr","Sa"], WTL = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  const p2 = n => String(n).padStart(2, "0");
  const hatZeit = z => String(z || "").length > 10;
  const dt = z => z ? new Date(hatZeit(z) ? z : z + "T00:00") : null;
  const kurz = d => `${p2(d.getDate())}.${p2(d.getMonth() + 1)}.`;
  const uhr = d => `${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const wtLang = z => { const d = dt(z); return d ? `${WTL[d.getDay()]}, ${kurz(d)}` : ""; };
  const tagDatum = z => { const d = dt(z); return d ? `${WT[d.getDay()]} ${kurz(d)}` : ""; };
  const lang = z => { const d = dt(z); return d ? `${kurz(d)}${d.getFullYear()}${hatZeit(z) ? `, ${uhr(d)} Uhr` : ""}` : ""; };
  const relativ = z => { const d = dt(z); if (!d) return ""; const s = (Date.now() - d) / 1000;
    if (s < 60) return "gerade eben"; if (s < 3600) return `vor ${Math.floor(s / 60)} Min.`; if (s < 86400) return `vor ${Math.floor(s / 3600)} Std.`;
    const t = Math.floor(s / 86400); return t === 1 ? "gestern" : `vor ${t} Tagen`; };
  const terminiert = p => hatZeit(p.anstoss) && !String(p.anstoss).endsWith("T00:00");
  const wochenende = z => { const d = dt(z); if (!d) return ""; const fr = new Date(d.getTime() - 2 * 864e5); return `${p2(fr.getDate())}. bis ${kurz(d)}`; };
  const zahlDE = n => Number(n).toLocaleString("de-DE");

  // ---------------- Zustand
  let N = [], SP = null, IN = null, FOTOS = {}, PATCH = null;
  let VIEW = "meldungen", MD = null, GAME = null, TIMER = null, SCROLL = 0, BACK = null;
  let TOREOFFEN = false, CHIPSEL = {heim:null, gast:null};
  let FDIR = "up", FIDX = 0, IMD = null, ALLCAL = false, KALINFO = null, MXINFO = null;
  let SEL = new Set(), VZOFFEN = false, NEWSALLE = false, WEITERE = false, STDALLE = false;
  try { SEL = new Set(JSON.parse(localStorage.getItem("woso-vereine") || "[]")); } catch(e) {}
  const saveSel = () => { try { localStorage.setItem("woso-vereine", JSON.stringify([...SEL])); } catch(e) {} };
  const zeigen = (...ks) => !SEL.size || ks.some(k => k && SEL.has(k));
  const setHash = h => { try { history.replaceState(null, "", h ? "#" + h : location.pathname + location.search); } catch(e) {} };

  // ---------------- Bilder
  const istSpielerin = m => POS.includes(m.pos || "");
  const bildPfad = m => { const f = FOTOS[m.spielerin] || {}; return f.portrait || m.foto || f.datei || null; };
  // Bildnachweis: Vereinsfreigabe (z. B. Portraits des HSV) ohne Lizenzlink, sonst Urheber und Lizenz
  const freigabe = f => !f.lizenz_url && !String(f.lizenz || "").startsWith("CC");
  const nachweis = f => !f || !f.autor ? "" : freigabe(f) ? `Foto: ${esc(f.autor)}` : `Foto: ${esc(f.autor)}${f.lizenz ? `, ${esc(f.lizenz)}` : ""}`;
  const quelleURL = f => f && /^https?:/.test(f.quelle || "") ? f.quelle : null;
  function bild(m, g){
    const r = g > 70 ? 11 : 8, k = KURZ[m.verein], f = bildPfad(m);
    const box = (inner, bg) => `<div class="bild" style="width:${g}px;height:${g}px;border-radius:${r}px;${bg ? `background:${bg}` : ""}" aria-hidden="true">${inner}</div>`;
    // Vereinsfarbe als Grund, damit bei transparenten Portraits nicht die Karte durchschimmert
    if (f) return box(`<img class="f" src="${esc(f)}" alt="" loading="lazy" onerror="this.remove()">`, KFARBE[k] || "var(--soft)");
    if (istSpielerin(m)) {
      const w = Math.round(g * .25);
      return box(SIL + (m.nr ? `<span class="nr" style="font-size:${Math.round(g * .21)}px">${esc(m.nr)}</span>` : "")
        + `<span class="wap" style="width:${w + 6}px;height:${w + 6}px">${logo(k, w)}</span>`,
        `linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),${KFARBE[k] || "var(--soft)"}`);
    }
    return box(logo(k, Math.round(g * .66)));
  }

  // ---------------- News
  function startelfZeile(elf){
    const sonst = [...new Set(elf.map(x => x.p).filter(p => p && !POS.includes(p)))].sort();
    return POS.concat(sonst).map(p => elf.filter(x => (x.p || "") === p)
      .map(x => esc(x.n) + (x.f === "neu" ? '<span class="neu">NEU</span>' : "")).join(", ")).filter(Boolean).join('<span class="mu"> - </span>');
  }
  function metaZeile(m, auf){
    const zeit = relativ(m.zeit);
    if (auf) return zeit;
    const verein = m.verein ? (KNAME[KURZ[m.verein]] || m.verein) : null;
    if (!istSpielerin(m) && String(m.pos || "").startsWith("Trainer") && m.spielerin)
      return `${zeit} · ${[verein, `${m.pos} ${m.spielerin}`].filter(Boolean).join(", ")}`;
    const wer = [m.spielerin, verein].filter(x => x && x !== "Spielansetzung").join(", ");
    return wer ? `${zeit} · ${wer}` : zeit;
  }
  function newsKarte(m){
    const a = m.aufstellung, auf = a && (a.startelf || []).length;
    const rechts = auf ? `<span class="nk-r" role="img" aria-label="${esc(m.verein)} gegen ${esc(a.gegner)}">${logo(KURZ[m.verein], 20)}${logo(KURZ[a.gegner], 20)}</span>` : plakette(meldungsStatus(m));
    return `<button class="nk" data-id="${esc(m.id)}">${bild(m, 72)}<div class="nk-b">
      <div class="nk-top"><div class="tags">${(m.tags || []).map(tag).join("")}${auf ? tag("AUFSTELLUNG") : ""}</div>${rechts}</div>
      ${auf ? `<p class="elf">${startelfZeile(a.startelf)}</p>` : `<h2>${esc(m.headline)}</h2>`}
      <div class="meta">${esc(metaZeile(m, auf))}</div></div></button>`;
  }
  const angeheftet = m => m.typ === "punkt" && m.pin_bis && dt(m.pin_bis) > Date.now();
  function punktKarte(m){
    const fest = angeheftet(m), md = m.md != null ? String(m.md) : "";
    return `<button class="pk${fest ? " fest" : ""}" data-id="${esc(m.id)}"><div class="pk-t" aria-hidden="true">${md ? `<b>${esc(md)}</b><span>SP.</span>` : "<b>·</b>"}</div>
      <div class="pk-b">${tag("AUF DEN PUNKT")}<h2>${esc(m.headline)}</h2><div class="z">${fest ? "Angeheftet bis zum Anpfiff" : esc(relativ(m.zeit))}</div></div></button>`;
  }
  function anteil(s){ const t = String(s).split(" von "); if (t.length !== 2) return null; const a = parseInt(t[0], 10), b = parseInt(t[1], 10);
    return (Number.isInteger(a) && Number.isInteger(b) && b > 0 && b <= 40 && a <= b) ? [a, b] : null; }
  function anaTeaser(A){
    const farbe = KFARBE[A.verein] || "#2F5BFF", st = A.stats || [];
    let unten = "";
    if (st[0]) unten += `<div class="kz"><b style="font-size:28px">${esc(st[0][0])}</b><span>${esc(st[0][1] || "")}</span></div>`;
    if (st[1]) { const t = anteil(st[1][0]);
      unten += t ? `<div style="display:grid;gap:6px"><div class="dots" aria-hidden="true">${Array.from({length: t[1]}, (_, i) => `<i class="${i < t[0] ? "t" : ""}"></i>`).join("")}</div>
        <div class="kz" style="display:block"><b style="font-family:var(--f-body);font-size:13px">${esc(st[1][0])}</b> <span>${esc(st[1][1] || "")}</span></div></div>`
        : `<div class="kz"><b style="font-size:26px;min-width:84px">${esc(st[1][0])}</b><span>${esc(st[1][1] || "")}</span></div>`; }
    return `<button class="ana" data-ana="1"><div class="ana-k" style="background:linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18)),${farbe}">
      <div class="z1"><span class="tg" style="color:${farbe}">TOP-ANALYSE</span><span>${esc(relativ(A.news_zeit))}</span></div>
      <div class="z2"><h3>${esc(A.titel)}</h3>${A.verein ? logo(A.verein, 44) : ""}</div></div>
      <div class="ana-b">${unten}<span class="go">Analyse lesen ›</span></div></button>`;
  }
  // Meldung gehört zu meinen Vereinen: eigener Verein, Gegner bei Aufstellungen, Liga-Meldungen (ohne Verein oder Spielansetzung) immer
  function meineMeldung(m){
    if (m.typ === "punkt") return true;
    const k = KURZ[m.verein];
    // Aufstellungen tragen pos "Spielansetzung", deshalb zuerst prüfen: zeigen, wenn einer der beiden Vereine gewählt ist
    if (m.aufstellung) return SEL.has(k) || SEL.has(KURZ[m.aufstellung.gegner]);
    if (!k || m.pos === "Spielansetzung") return true;
    return SEL.has(k);
  }
  function list(){
    GAME = null;
    const now = Date.now();
    const fest = N.filter(angeheftet).sort((a, b) => dt(a.pin_bis) - dt(b.pin_bis));
    const alle = N.filter(m => !fest.includes(m)).sort((a, b) => (dt(b.zeit) || 0) - (dt(a.zeit) || 0));
    const filter = SEL.size && !NEWSALLE;
    const rest = filter ? alle.filter(meineMeldung) : alle;
    let A = IN && IN.analyse && IN.analyse.news_zeit && dt(IN.analyse.news_zeit) <= now ? IN.analyse : null;
    if (!fest.length && !alle.length){ $("#main").innerHTML = vereinsZeile() + '<p class="leer">Noch keine Meldungen.</p>'; return; }
    let h = fest.map(punktKarte).join("");
    if (SEL.size) h += NEWSALLE
      ? `<div class="hinw"><span>Alle Meldungen</span><button data-newsalle="0">Nur meine Vereine</button></div>`
      : !rest.length ? `<div class="leer" style="padding:28px 4px;display:grid;gap:10px;justify-items:center"><span>Keine Meldungen deiner Vereine in den letzten 14 Tagen.</span><button class="lk" data-newsalle="1">Alle zeigen</button></div>`
      : "";
    rest.forEach(m => { if (A && dt(A.news_zeit) >= (dt(m.zeit) || 0)) { h += anaTeaser(A); A = null; } h += m.typ === "punkt" ? punktKarte(m) : newsKarte(m); });
    if (A) h += anaTeaser(A);
    if (filter && rest.length) h += `<div class="hinw"><span>${alle.length - rest.length} weitere Meldungen anderer Vereine</span><button data-newsalle="1">Alle zeigen</button></div>`;
    $("#main").innerHTML = vereinsZeile() + `<div class="liste">${h}</div>`;
  }

  // ---------------- Artikel
  const zurueck = (t = "‹ Zurück") => `<button class="back" data-zu="1">${t}</button>`;
  function sortiert(l){ const r = {TW:0,ABW:1,DM:2,MF:3,OM:4,ST:5}; return l.map((x, i) => [x, i]).sort((a, b) => ((r[a[0].p] ?? 9) - (r[b[0].p] ?? 9)) || a[1] - b[1]).map(x => x[0]); }
  function chip(o){
    let h = (o.stufe ? stufeSym(o.stufe) : "") + (o.ein ? '<span class="ein" aria-label="eingewechselt">↑</span>' : "") + `<span class="cn">${esc(o.n)}</span>`;
    if (o.tore > 0) h += BALL + (o.tore > 1 ? `<b class="tz">${o.tore}</b>` : "");
    if (o.gelb && !o.rot) h += karte(false);
    if (o.rot) h += karte(true);
    if (o.aus) h += `<span class="aus" aria-label="ausgewechselt in Minute ${esc(o.aus)}">↓${esc(o.aus)}'</span>`;
    if (o.grund) h += `<span class="gr">${esc(o.grund)}</span>`;
    if (o.info) h += `<span class="gr">(${esc(o.info)})</span>`;
    if (o.mark === "neu") h += '<span class="neu">NEU</span>'; else if (o.mark === "raus") h += '<span class="raus">RAUS</span>';
    const cls = `chip${o.stufe ? " st" : ""}${o.dim ? " dim" : ""}${o.sel ? " sel" : ""}`;
    return o.btn ? `<button class="${cls}" data-chip="${esc(o.btn)}" title="${esc(o.title || "")}">${h}</button>` : `<span class="${cls}">${h}</span>`;
  }
  function posZeilen(l, f){
    const sonst = [...new Set(l.map(x => x.p || "").filter(p => !POS.includes(p)))];
    return `<div class="rasen">${POS.concat(sonst).map(p => { const xs = l.filter(x => (x.p || "") === p);
      return xs.length ? `<div class="pz"><i>${esc(p)}</i><div class="chips">${xs.map(f).join("")}</div></div>` : ""; }).join("")}</div>`;
  }
  function aufBlock(a){
    return `<div class="kartebox">${kap("Startelf")}${posZeilen(a.startelf || [], s => chip({n: s.n, info: s.i, mark: s.f}))}
      ${(a.bank || []).length ? kap("Bank") + `<div class="chips">${sortiert(a.bank).map(s => chip({n: s.n, info: s.i, mark: s.f})).join("")}</div>` : ""}
      ${(a.fehlt || []).length ? kap("Nicht im Kader") + `<div class="chips">${sortiert(a.fehlt).map(s => chip({n: s.n, info: s.i, mark: s.f, dim: true})).join("")}</div>` : ""}
      <div class="leg"><span><b class="neu" style="margin:0;border:0;padding:0">NEU</b> und <b class="raus" style="border:0;padding:0">RAUS</b> im Vergleich zum letzten Spiel</span></div></div>`;
  }
  function article(id){
    const m = N.find(x => x.id === id); if (!m) return list();
    if (m.typ === "punkt") { $("#main").innerHTML = `<div class="det">${zurueck()}${punktArtikel(m)}</div>`; window.scrollTo(0, 0); return; }
    const a = m.aufstellung, auf = a && (a.startelf || []).length;
    const st = STATUS[String(meldungsStatus(m) || "").toLowerCase()];
    const kopf = auf
      ? `<div style="display:grid;gap:8px"><div class="tags">${(m.tags || []).map(tag).join("")}${tag("AUFSTELLUNG")}</div>
          <div style="display:flex;gap:8px;align-items:center">${logo(KURZ[m.verein], 30)}<h1 class="disp" style="font-size:26px">${esc(m.headline)}</h1></div>
          <div class="dat">${esc(lang(m.zeit))}</div></div>${aufBlock(a)}`
      : `<div style="display:grid;gap:12px"><div class="mk">${bild(m, 96)}<div class="mk-m"><div class="tags">${(m.tags || []).map(tag).join("")}</div>
          <div class="wer">${esc(m.spielerin)}</div><div class="dat" style="font-size:14px">${esc([m.verein, m.pos].filter(Boolean).join(" · "))}</div></div>
          ${st ? `<div class="mk-st">${plakette(meldungsStatus(m), 28)}<span>${st[2]}</span></div>` : ""}</div>
          <h1 class="disp" style="font-size:30px">${esc(m.headline)}</h1><div class="dat">${esc(lang(m.zeit))}</div></div>
          <div class="body">${(m.text || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>`;
    // Nachweis zum gezeigten Foto: Eintrag aus fotos.json hat Vorrang, sonst der Nachweis aus der Meldung
    const fi = FOTOS[m.spielerin], fc = m.foto_credit;

      <p>Die Webseite wosoinsider.de und die Dateien für die App liegen bei GitHub Pages, einem Dienst der GitHub, Inc., 88 Colin P. Kelly Jr. Street, San Francisco, CA 94107, USA. Beim Aufruf verarbeitet GitHub technisch notwendige Verbindungsdaten: IP-Adresse, Datum und Uhrzeit, abgerufene Datei, Browser oder App-Kennung, Betriebssystem und gegebenenfalls die zuvor besuchte Seite. Das dient der sicheren und stabilen Auslieferung (Art. 6 Abs. 1 lit. f DSGVO). Wie lange GitHub diese Daten speichert, legt GitHub selbst fest. Wir erhalten keine Logfiles und können keine Nutzerinnen oder Nutzer identifizieren.</p>
      <p>GitHub verarbeitet Daten auch in den USA. GitHub ist nach dem EU-U.S. Data Privacy Framework zertifiziert, für das ein Angemessenheitsbeschluss der EU-Kommission besteht (Art. 45 DSGVO). Weitere Informationen: <a href="https://docs.github.com/en/site-policy/privacy-policies/github-privacy-statement">Datenschutzerklärung von GitHub</a>.</p>
      <p>Die Schriften werden zusammen mit der Seite ausgeliefert. Es besteht keine Verbindung zu Google Fonts oder anderen Schriftanbietern.</p>
      <h2>6. Keine Profile, keine automatisierten Entscheidungen</h2>
      <p>Wir bilden keine Nutzerprofile und verkaufen oder teilen keine Daten. Eine automatisierte Entscheidungsfindung nach Art. 22 DSGVO findet nicht statt.</p>
      <h2>7. App Store</h2>
      <p>Die App laden Sie über den App Store von Apple. Dafür verarbeitet Apple Daten wie Ihre Apple-ID, Gerätekennung und Kaufhistorie in eigener Verantwortung. Wir haben darauf keinen Einfluss und erhalten keine personenbezogenen Daten von Apple. Haben Sie in den iOS-Einstellungen zugestimmt, Analysedaten mit App-Entwicklern zu teilen, stellt Apple uns anonymisierte Absturzberichte und Nutzungsstatistiken bereit. Einzelheiten stehen in der <a href="https://www.apple.com/de/legal/privacy/">Datenschutzrichtlinie von Apple</a>.</p>
      <h2>8. Kontakt per E-Mail</h2>
      <p>Wenn Sie an <a href="mailto:redaktion@wosoinsider.de">redaktion@wosoinsider.de</a> schreiben, verarbeiten wir Ihre E-Mail-Adresse, Ihren Namen (falls angegeben) und Ihre Nachricht, um die Anfrage zu bearbeiten (Art. 6 Abs. 1 lit. b oder f DSGVO). Hinweise an die Redaktion nutzen wir für die Berichterstattung. Ihren Namen veröffentlichen wir nur mit Ihrer Zustimmung. Die Daten löschen wir, sobald die Anfrage erledigt ist und keine Aufbewahrungspflicht besteht.</p>
      <p>Das Postfach läuft über Google Workspace. Vertragspartner und Auftragsverarbeiter (Art. 28 DSGVO) ist die Google Cloud EMEA Limited, 70 Sir John Rogerson's Quay, Dublin 2, Irland. Google kann Daten auch in den USA verarbeiten. Die Google LLC ist nach dem EU-U.S. Data Privacy Framework zertifiziert, für das ein Angemessenheitsbeschluss der EU-Kommission besteht (Art. 45 DSGVO).</p>
      <h2>9. Links zu anderen Seiten</h2>
      <p>Quellen, die Sportschau und Instagram-Profile sind verlinkt. Daten werden erst übertragen, wenn Sie einen Link antippen. Dann gilt die Datenschutzerklärung der jeweiligen Seite.</p>
      <h2>10. Berichterstattung über Spielerinnen</h2>
      <p>Meldungen nennen Spielerinnen, Trainerinnen und Trainer im Rahmen der Sportberichterstattung (journalistische Zwecke, Art. 85 DSGVO in Verbindung mit § 23 MStV). Die redaktionelle Verantwortung trägt Finn Clausen.</p>
      <p>Für Angaben zur Gesundheit gelten feste Regeln: Wir berichten nur, was Verein, Verband oder Medien bereits veröffentlicht haben, und nur so genau, wie es für die Frage nötig ist, ob und wann eine Spielerin spielen kann. Eigene Vermutungen zu Diagnosen veröffentlichen wir nicht. Meldungen werden nach 14 Tagen aus der App entfernt.</p>
      <p>Fotos stammen von Wikimedia Commons unter freien Lizenzen oder werden mit Genehmigung genutzt. Betroffene können jederzeit unter <a href="mailto:redaktion@wosoinsider.de">redaktion@wosoinsider.de</a> eine Korrektur, die Entfernung eines Fotos oder einer Angabe verlangen. Berechtigte Anliegen setzen wir unverzüglich um.</p>
      <h2>11. Ihre Rechte</h2>
      <p>Sie haben das Recht auf Auskunft (Art. 15), Berichtigung (Art. 16), Löschung (Art. 17), Einschränkung der Verarbeitung (Art. 18) und Datenübertragbarkeit (Art. 20 DSGVO). Eine Nachricht an <a href="mailto:redaktion@wosoinsider.de">redaktion@wosoinsider.de</a> genügt.</p>
      <p><b>Widerspruchsrecht:</b> Verarbeiten wir Daten auf Grundlage berechtigter Interessen (Art. 6 Abs. 1 lit. f DSGVO), können Sie aus Gründen, die sich aus Ihrer besonderen Situation ergeben, jederzeit widersprechen (Art. 21 DSGVO). Wir verarbeiten die Daten dann nicht mehr, es sei denn, es liegen zwingende schutzwürdige Gründe vor.</p>
      <h2>12. Beschwerderecht</h2>
      <p>Sie können sich bei einer Datenschutz-Aufsichtsbehörde beschweren. Zuständig für uns ist das Bayerische Landesamt für Datenschutzaufsicht (BayLDA), Promenade 18, 91522 Ansbach.</p>
      <h2>13. Stand</h2>
      <p>Oktober 2026. Ändert sich etwas an App oder Webseite, passen wir diese Erklärung an.</p>`,
    kontakt: () => `<h1>Kontakt</h1>
      <p>Eine Adresse für alles: <a href="mailto:redaktion@wosoinsider.de">redaktion@wosoinsider.de</a></p>
      <ul>
      <li>Fragen zu WOSOINSIDER und Wünsche für neue Funktionen</li>
      <li>Fehler in einer Meldung oder Aufstellung, neue Informationen zu Verletzungen, Sperren oder Rückkehr, bitte mit Link zur Quelle</li>
      <li>Auskunft, Berichtigung oder Löschung personenbezogener Daten sowie Fragen zu Bild- und Markenrechten</li>
      </ul>
      <p>Die Postanschrift steht im Impressum.</p>`,
    "so-entsteht": () => `<h1>KI-Hinweis &amp; Methodik</h1>
      <p>WOSOINSIDER wird mit künstlicher Intelligenz erstellt. Wir kennzeichnen das offen, wie es Art. 50 Abs. 4 der europäischen KI-Verordnung für KI-erzeugte Texte von öffentlichem Interesse vorsieht.</p>
      <h2>So entsteht eine Meldung</h2>
      <ul><li>Mehrmals täglich, an Spieltagen stündlich, sammelt ein Skript öffentlich zugängliche Meldungen: Vereinsseiten, DFB, Sportschau und regionale Medien.</li>
        <li>Ein KI-System (Claude von Anthropic) sortiert Irrelevantes aus und fasst die Meldungen in eigenen Worten zusammen. Jede Meldung nennt und verlinkt ihre Quelle.</li>
        <li>Die Meldungen werden vor der Veröffentlichung nicht einzeln von einem Menschen geprüft. Die redaktionelle Verantwortung trägt Finn Clausen.</li></ul>
      <h2>Regeln für die KI</h2>
      <ul><li>Nichts erfinden: Jede Meldung stützt sich auf eine Quelle, Unbestätigtes wird als unbestätigt gekennzeichnet.</li>
        <li>Medizinische Details nur, soweit Verein oder Medien sie veröffentlicht haben.</li>
        <li>Wörtliche Zitate höchstens 15 Wörter, sonst eigene Formulierungen.</li></ul>
      <h2>Mögliche Aufstellungen</h2>
      <p>Die Prognosen sind eine Einschätzung von WOSOINSIDER, keine Quelle behauptet sie. Grundlage sind die Einsätze der letzten fünf Ligaspiele (das jüngste zählt am meisten), gemeldete Verletzungen und Sperren sowie redaktionelle Einschätzungen mit Begründung. Sicher heißt: In unserer Rückrechnung der Spieltage 4 bis 8 standen gut neun von zehn so eingestuften Spielerinnen in der Startelf. In Englischen Wochen, also bei mindestens drei Pflichtspielen in höchstens acht Tagen, stufen wir Feldspielerinnen höchstens als Erwartet ein. Die Begründung erscheint beim Antippen einer Spielerin. Sobald die offizielle Aufstellung vorliegt, ersetzt sie die Prognose.</p>
      <h2>Inside</h2>
      <p>Der Reiter Inside erscheint einmal pro Woche. Ein Skript wertet Statistiken, Aufstellungen und Liveticker aller Ligaspiele aus (Sportschau), dazu Termine von DFB und UEFA. Daraus entstehen Formkurven, Rotationsmuster, Standard-Übersichten und Fakten zu den nächsten Spielen. Texte und Einschätzungen schreibt die KI auf dieser Grundlage. Alles, was Bewertung ist, steht unter „Unsere Einschätzung“. Standardschützinnen leiten wir aus Spielberichten ab, die Sicherheit zeigt die Schriftstärke.</p>
      <h2>Kickbase-Einordnung</h2>
      <p>Die Einordnung „Für Kickbase“ ist eine Meinung und keine Empfehlung mit Erfolgsgarantie.</p>
      <h2>Fehler gefunden?</h2>
      <p>Hinweise bitte an <a href="mailto:${mail("redaktion")}">${mail("redaktion")}</a>. Korrekturen werden in der Meldung mit dem Tag UPDATE nachgetragen.</p>`
  };
  const INFO = Object.assign({}, LEGAL, {
    bildnachweise: () => `<h1>Bildnachweise</h1><p class="mu">Fotos von Wikimedia Commons unter freien Lizenzen, teils zugeschnitten. Portraits des Hamburger SV mit Genehmigung des Vereins. Vereinslogos mit Genehmigung der Vereine.</p>
      ${Object.keys(FOTOS).sort((a, b) => a.localeCompare(b, "de")).map(n => { const f = FOTOS[n];
        return `<div class="bn"><b>${esc(n)}</b><small>Foto: ${esc(f.autor || "unbekannt")}${f.lizenz ? `, ${f.lizenz_url ? `<a href="${esc(f.lizenz_url)}" target="_blank" rel="noopener">${esc(f.lizenz)}</a>` : esc(f.lizenz)}` : ""}${quelleURL(f) ? ` · <a href="${esc(quelleURL(f))}" target="_blank" rel="noopener">Quelle</a>` : ""}</small></div>`; }).join("") || '<p class="mu">Wird geladen …</p>'}`,
    patches: () => `<h1>Patches</h1>${PATCH && (PATCH.eintraege || []).length ? PATCH.eintraege.map(e => `<div class="pv"><div class="h"><span>Version ${esc(e.version)}</span><small>${esc(e.datum)}</small></div>
      ${e.titel ? `<span class="t">${esc(e.titel)}</span>` : ""}<ul>${(e.aenderungen || []).map(a => `<li>${esc(a)}</li>`).join("")}</ul></div>`).join("") : '<p class="mu">Noch keine Patchnotes geladen.</p>'}`
  });
  function legal(k){
    if (!INFO[k]) return;
    if (!BACK) BACK = {view: VIEW, game: GAME, md: MD, y: window.scrollY};
    clearInterval(TIMER);
    setHash(k);
    $("#main").innerHTML = `<article class="doc"><button class="back" data-legalback="1" style="justify-self:start">‹ Zurück</button>${INFO[k]()}</article>`;
    window.scrollTo(0, 0);
  }
  function legalBack(){
    const b = BACK || {view: "meldungen"}; BACK = null;
    if (b.view === "inside"){ show("inside"); window.scrollTo(0, b.y || 0); return; }
    if (b.view === "spielplan"){ VIEW = "spielplan"; MD = b.md; setHash("spielplan"); b.game ? spiel(b.game) : spielplan(); TIMER = setInterval(loadSP, 5 * 60000); }
    else { setHash(""); list(); }
    window.scrollTo(0, b.y || 0);
  }

  // ---------------- Laden
  const json = f => fetch(f, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  function loadSP(){
    return json("spielplan.json").then(d => { SP = d; if (MD == null) MD = d.aktuell;
      if (BACK) return; if (VIEW === "spielplan") GAME ? spiel(GAME, true) : spielplan(); else if (VIEW === "inside" && IN) { const y = window.scrollY; inside(); window.scrollTo(0, y); } })
      .catch(() => { if (VIEW === "spielplan" && !SP) $("#main").innerHTML = '<p class="leer">Der Spielplan konnte nicht geladen werden. Seite neu laden.</p>'; });
  }
  function loadIN(){
    return Promise.all([json("inside.json"), fetch("fotos.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {}).catch(() => ({}))])
      .then(([d, f]) => { IN = d; FOTOS = f || {}; if (BACK) return;
        if (VIEW === "inside") inside(); else if (VIEW === "meldungen" && document.querySelector("#main .liste")) list(); })
      .catch(() => { if (VIEW === "inside" && !IN) $("#main").innerHTML = '<p class="leer">Inside konnte nicht geladen werden. Seite neu laden.</p>'; });
  }
  function show(v){
    VIEW = v; BACK = null;
    document.querySelectorAll(".seg[role=tablist] button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === v));
    setHash(v === "spielplan" ? "spielplan" : v === "inside" ? "inside" : "");
    clearInterval(TIMER);
    if (v === "spielplan"){ GAME = null; spielplan(); loadSP(); TIMER = setInterval(loadSP, 5 * 60000); }
    else if (v === "inside"){ inside(); if (!IN) loadIN(); }
    else list();
    window.scrollTo(0, 0);
  }

  function neuZeichnen(){
    const y = window.scrollY;
    if (VIEW === "inside") inside(); else if (VIEW === "spielplan") spielplan(); else list();
    window.scrollTo(0, y);
  }
  document.addEventListener("click", e => {
    const q = s => e.target.closest(s);
    let x;
    if ((x = q("[data-legal]"))) { legal(x.dataset.legal); return; }
    if (q("[data-legalback]")) { legalBack(); return; }
    if ((x = q("[data-tab]"))) { show(x.dataset.tab); return; }
    if ((x = q("[data-tabgo]"))) { show(x.dataset.tabgo); return; }
    if (q("[data-zu]")) { setHash(""); VIEW === "inside" ? inside() : list(); window.scrollTo(0, SCROLL || 0); return; }
    if ((x = q("[data-club]"))) { const k = x.dataset.club; SEL.has(k) ? SEL.delete(k) : SEL.add(k); saveSel(); FIDX = 0; NEWSALLE = false; neuZeichnen(); return; }
    if (q("[data-clear]")) { SEL.clear(); saveSel(); FIDX = 0; NEWSALLE = false; neuZeichnen(); return; }
    if (q("[data-vzauf]")) { VZOFFEN = !VZOFFEN; neuZeichnen(); return; }
    if ((x = q("[data-newsalle]"))) { NEWSALLE = x.dataset.newsalle === "1"; neuZeichnen(); return; }
    if (q("[data-weitere]")) { WEITERE = !WEITERE; neuZeichnen(); return; }
    if (q("[data-stdalle]")) { STDALLE = !STDALLE; neuZeichnen(); return; }
    if ((x = q("[data-dir]"))) { FDIR = x.dataset.dir; FIDX = 0; const y = window.scrollY; inside(); window.scrollTo(0, y); return; }
    if ((x = q("[data-fstep]"))) { const l = formListe(FDIR), j = Math.min(Math.max(FIDX + Number(x.dataset.fstep), 0), l.length - 1), r = $("#rail");
      FIDX = j; formIndexAnzeigen(); if (r) r.scrollTo({left: j * (r.clientWidth + 12), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); return; }
    if ((x = q("[data-imd]"))) { IMD = Number(x.dataset.imd); const y = window.scrollY; inside(); window.scrollTo(0, y); return; }
    if (q("[data-allcal]")) { ALLCAL = !ALLCAL; const y = window.scrollY; inside(); window.scrollTo(0, y); return; }
    if ((x = q("[data-kal]"))) { KALINFO = x.dataset.kal; const i = $("#kalinfo"); if (i) { i.textContent = KALINFO; i.classList.add("an"); } return; }
    if ((x = q("[data-mx]"))) { MXINFO = x.dataset.mx; document.querySelectorAll(".mx .c[aria-pressed=true]").forEach(c => c.setAttribute("aria-pressed", "false")); x.setAttribute("aria-pressed", "true");
      const i = $("#mxinfo"); if (i) { i.textContent = MXINFO; i.classList.add("an"); } return; }
    if ((x = q("[data-ana]"))) { SCROLL = window.scrollY; setHash("analyse"); anaArticle(); return; }
    if ((x = q("[data-punkt]"))) { SCROLL = window.scrollY; article(x.dataset.punkt); return; }
    if ((x = q("[data-step]"))) { blaettern(Number(x.dataset.step)); return; }
    if ((x = q("[data-md]"))) { MD = Number(x.dataset.md); spielplan(); return; }
    if ((x = q("[data-game]"))) { SCROLL = window.scrollY; spiel(x.dataset.game); return; }
    if (q("[data-back]")) { spielplan(); window.scrollTo(0, SCROLL || 0); return; }
    if (q("[data-tore]")) { TOREOFFEN = !TOREOFFEN; spiel(GAME, true); return; }
    if ((x = q("[data-chip]"))) { const [s, n] = x.dataset.chip.split("|"); CHIPSEL[s] = CHIPSEL[s] === n ? null : n; spiel(GAME, true); return; }
    if ((x = q("[data-id]"))) { SCROLL = window.scrollY; setHash(x.dataset.id); article(x.dataset.id); }
  });

  json("news.json").then(d => {
    N = d.meldungen || [];
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === "spielplan") show("spielplan");
    else if (h === "inside") show("inside");
    else if (h === "analyse") { list(); loadIN().then(() => { if (IN && IN.analyse) anaArticle(); }); }
    else if (INFO[h]) { list(); legal(h); }
    else h && N.some(m => m.id === h) ? article(h) : list();
  }).catch(() => { if (VIEW === "meldungen") $("#main").innerHTML = '<p class="leer">Die Meldungen konnten nicht geladen werden. Seite neu laden.</p>'; });
  fetch("patchnotes.json", {cache: "no-store"}).then(r => r.ok ? r.json() : null).then(d => { PATCH = d; }).catch(() => {});
  loadSP();
  loadIN();
})();
</script>

</body></html>
